const shortMonth = key => { const [y, m] = key.split('-').map(Number); return cap(new Date(y, m - 1, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '')); };
const fmtDate = iso => new Date(iso).toLocaleDateString('pt-BR');
const fmtTime = iso => new Date(iso).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
const fmtDateTime = iso => fmtDate(iso) + ' às ' + fmtTime(iso);
const onlyDigits = s => String(s || '').replace(/\D/g, '');
const parseNum = s => {
  const t = String(s).trim();
  if (!t) return NaN;
  return t.includes(',') ? parseFloat(t.replace(/\./g, '').replace(',', '.')) : parseFloat(t);
};
const maskDoc = v => {
  const d = onlyDigits(v).slice(0, 14);
  if (d.length <= 11) {
    return d.replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d)/, '$1.$2').replace(/(\d{3})(\d{1,2})$/, '$1-$2');
  }
  return d.replace(/^(\d{2})(\d)/, '$1.$2').replace(/^(\d{2})\.(\d{3})(\d)/, '$1.$2.$3').replace(/\.(\d{3})(\d)/, '.$1/$2').replace(/(\d{4})(\d)/, '$1-$2');
};
const maskPhone = v => {
  const d = onlyDigits(v).slice(0, 11);
  if (!d) return '';
  if (d.length <= 2) return '(' + d;
  if (d.length <= 6) return '(' + d.slice(0, 2) + ') ' + d.slice(2);
  if (d.length <= 10) return '(' + d.slice(0, 2) + ') ' + d.slice(2, 6) + '-' + d.slice(6);
  return '(' + d.slice(0, 2) + ') ' + d.slice(2, 7) + '-' + d.slice(7);
};
const maskCep = v => {
  const d = onlyDigits(v).slice(0, 8);

};
const lastMonths = n => {
  const out = []; const now = new Date();
  for (let i = n - 1; i >= 0; i--) {

    out.push(x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0'));

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();

    } catch (e2) { return false; }
  }
}

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function seedData() {
  const rnd = mulberry32(20260921);
  const now = Date.now();
  const products = [
    { id: 'p3', nome: 'Carvão 3kg', custoCent: 750, precoCent: 1200, estoque: 142, minimo: 40, unidade: 'saco' },
    { id: 'p5', nome: 'Carvão 5kg', custoCent: 1200, precoCent: 1990, estoque: 96, minimo: 30, unidade: 'saco' },
    { id: 'p10', nome: 'Carvão Restaurante 10kg', custoCent: 2200, precoCent: 3400, estoque: 18, minimo: 25, unidade: 'saco' },
    { id: 'p20', nome: 'Carvão Atacado 20kg', custoCent: 4000, precoCent: 6200, estoque: 40, minimo: 10, unidade: 'saco' }
  ];
  const clients = [
    { id: 'c1', nome: 'Restaurante Sabor da Serra Ltda', doc: '12.345.678/0001-90', ie: '123.456.789.00', email: 'contato@saborserra.com.br', tel: '(31) 99999-0001', endereco: 'Av. das Palmeiras, 450', cep: '37470-000', cidade: 'São Lourenço - MG' },
    { id: 'c2', nome: 'Churrascaria Boi na Brasa', doc: '98.765.432/0001-10', ie: '', email: '', tel: '(31) 98888-0002', endereco: 'Rua do Comércio, 88', cep: '', cidade: 'São Lourenço - MG' }
  ];
  const company = {
    razao: 'Carvão Romão - Essência Plantada',
    cnpj: '00.000.000/0001-00',
    telefone: '(35) 99999-0000',
    endereco: 'São Lourenço - MG',
    logoUrl: '',
    rodape: 'Carvão 100% Eucalipto - Obrigado pela preferência!'
  };
  const day = new Date(now).getDate();
  const plan = [];
  for (let i = 0; i < 5; i++) plan.push(Math.floor(rnd() * day));
  plan.sort((a, b) => b - a);
  const qtys = [5, 10, 15, 20];
  const pays = ['Pix', 'Dinheiro', 'Cartão'];
  const sales = plan.map((daysAgo, idx) => {
    let d = new Date(now - daysAgo * 864e5);
    const c = clients[Math.floor(rnd() * clients.length)];
    const p = products[Math.floor(rnd() * products.length)];
    const itens = [{ produtoId: p.id, nome: p.nome, qtd: qtys[Math.floor(rnd() * qtys.length)], precoCent: p.precoCent, custoCent: p.custoCent }];
    const totalCent = itens[0].qtd * itens[0].precoCent;
    return { id: 's' + idx, numero: idx + 1, data: d.toISOString(), cliente: { id: c.id, nome: c.nome, doc: c.doc, ie: c.ie, email: c.email, tel: c.tel, endereco: c.endereco, cep: c.cep, cidade: c.cidade }, itens, subtotalCent: totalCent, descontoCent: 0, totalCent, pagamento: pays[Math.floor(rnd() * pays.length)] };
  }).reverse();

  const expenses = [
    { id: 'e1', descricao: 'Sacos de Papel e Embalagens', categoria: 'Embalagem', valorCent: 35000, data: new Date(now - 2 * 864e5).toISOString() }
  ];

  return { products, clients, sales, expenses, receivables: [], movements: [], company, seq: plan.length + 1, lastBackupAt: null, autoBackup: true };
}

const KEY = 'carvao-estoque-vendas-v3';
function migrateDb(d) {
  const products = (d.products || []).map(p => ({
    unidade: 'saco', custoCent: p.custoCent ?? toCents(p.custo ?? 0), precoCent: p.precoCent ?? toCents(p.preco ?? 0),
    estoque: Number(p.estoque) || 0, minimo: Number(p.minimo) || 0, ...p
  }));
  const sales = (d.sales || []).map(s => {
    const itens = (s.itens || []).map(i => ({ ...i, precoCent: i.precoCent ?? toCents(i.preco ?? 0), custoCent: i.custoCent ?? 0 }));
    const subtotalCent = s.subtotalCent ?? Math.round(itens.reduce((a,i)=>a+i.qtd*i.precoCent,0));
    const descontoCent = s.descontoCent ?? toCents(s.desconto ?? 0);
    return { ...s, itens, subtotalCent, descontoCent, totalCent: s.totalCent ?? Math.max(0, subtotalCent-descontoCent) };
  });
  const expenses = (d.expenses || []).map(e => ({ ...e, valorCent: e.valorCent ?? toCents(e.valor ?? 0) }));
  return { expenses: [], receivables: [], movements: [], lastBackupAt: null, autoBackup: true, ...d, products, sales, expenses };
}
function loadDb() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) { const d = JSON.parse(raw); if (d && d.products && d.clients && d.sales && d.company) return migrateDb(d); }
  } catch (e) {}
  return seedData();
}
function saveDb(db) {
  try {
    localStorage.setItem(KEY, JSON.stringify(db));
    if (db.autoBackup !== false) {
      localStorage.setItem(KEY + '-auto-backup', JSON.stringify({ savedAt: new Date().toISOString(), db }));
    }
  } catch (e) {}
}
function getAutoBackupInfo() {
  try { return JSON.parse(localStorage.getItem(KEY + '-auto-backup') || 'null'); } catch(e) { return null; }
}

  return html`<svg xmlns="http://www.w3.org/2000/svg" width=${size} height=${size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" class=${className} aria-hidden="true" dangerouslySetInnerHTML=${{ __html: ICONS[name] }}></svg>`;

}

function Badge({ tone, children }) {
  const t = { ok: 'bg-ok-soft text-ok', warn: 'bg-warn-soft text-warn', bad: 'bg-bad-soft text-bad', neutral: 'bg-canvas text-muted' }[tone] || 'bg-canvas text-muted';
  return html`<span class=${'inline-flex items-center rounded-full px-2 py-0.5 text-xs font-semibold ' + t}>${children}</span>`;
}

function Modal({ title, onClose, children }) {
  useEffect(() => {
    const onKey = e => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

function receiptText(sale, company) {
  const l = [];
  l.push(company.razao, 'CNPJ: ' + company.cnpj, 'Tel.: ' + company.telefone, company.endereco, '');
  l.push('COMPROVANTE DE VENDA Nº ' + pad(sale.numero), fmtDateTime(sale.data), '');
  l.push('Cliente: ' + sale.cliente.nome);
  if (sale.cliente.doc) l.push('CPF/CNPJ: ' + sale.cliente.doc);
  if (sale.cliente.ie) l.push('Inscrição Estadual (IE): ' + sale.cliente.ie);
  if (sale.cliente.email) l.push('E-mail: ' + sale.cliente.email);
  if (sale.cliente.tel) l.push('Telefone: ' + sale.cliente.tel);
  if (sale.cliente.endereco) {
    let endStr = sale.cliente.endereco;
    if (sale.cliente.cep) endStr += ' - CEP: ' + sale.cliente.cep;
    l.push('Endereço: ' + endStr);
  }
  if (sale.cliente.cidade) l.push('Cidade: ' + sale.cliente.cidade);
  l.push('');
  sale.itens.forEach(i => l.push(i.qtd + ' x ' + i.nome + ' (' + money(i.precoCent) + ') = ' + money(i.qtd * i.precoCent)));
  l.push('', 'TOTAL: ' + money(sale.totalCent), 'Pagamento: ' + sale.pagamento, '', company.rodape || '');
  return l.join('\n');
}

function NewSale({ db, onFinalize, gotoTab }) {
  const [clienteId, setClienteId] = useState('');

  const [produtoId, setProdutoId] = useState('');
  const [qtd, setQtd] = useState('1');
  const [itens, setItens] = useState([]);
  const [pagamento, setPagamento] = useState('Pix');
  const [desconto, setDesconto] = useState('');
  const [prazoDias, setPrazoDias] = useState('30');
  const [err, setErr] = useState('');
  const [errCart, setErrCart] = useState('');

  const clientesFiltrados = useMemo(() => {
    const q = buscaCliente.trim().toLowerCase();
    if (!q) return db.clients;
    return db.clients.filter(c => (c.nome || '').toLowerCase().includes(q) || (c.doc || '').includes(q) || (c.tel || '').includes(q));
  }, [db.clients, buscaCliente]);

  const produto = db.products.find(p => p.id === produtoId);
  const noCarrinho = produto ? (itens.find(i => i.produtoId === produto.id) || { qtd: 0 }).qtd : 0;
  const qn = parseNum(qtd);
  const preview = produto && qn > 0 ? qn * (produto.precoCent || 0) : 0;
  const subtotalCent = Math.round(itens.reduce((a, i) => a + i.qtd * i.precoCent, 0));
  const descontoCent = Math.min(Math.max(0, toCents(parseNum(desconto))), subtotalCent);
  const totalCent = Math.max(0, subtotalCent - descontoCent);

  const addItem = () => {
    setErr('');
    if (!produto) return setErr('Escolha um produto.');
    if (!Number.isInteger(qn) || qn < 1) return setErr('Informe uma quantidade inteira, de 1 em diante.');
    const disponivel = produto.estoque - noCarrinho;
    if (qn > disponivel) return setErr('Estoque insuficiente: restam ' + disponivel + ' ' + (produto.unidade || 'un.') + '.');
    setItens(list => {
      const ex = list.find(i => i.produtoId === produto.id);
      if (ex) return list.map(i => i.produtoId === produto.id ? { ...i, qtd: i.qtd + qn } : i);
      return [...list, { produtoId: produto.id, nome: produto.nome, qtd: qn, precoCent: produto.precoCent, custoCent: produto.custoCent || 0 }];
    });
    setProdutoId(''); setQtd('1'); setErrCart('');
  };
  const finalize = () => {
    setErrCart('');
    if (!clienteId) return setErrCart('Escolha explicitamente o cliente na lista.');
    if (!itens.length) return setErrCart('Adicione ao menos um item.');
    if (pagamento === 'Boleto') {
      const dias = parseNum(prazoDias);
      if (!Number.isInteger(dias) || dias < 1) return setErrCart('Informe a quantidade de dias do boleto.');
    }
    onFinalize({ clienteId, itens, pagamento, descontoCent, prazoDias: pagamento === 'Boleto' ? Number(prazoDias) : 0 });
    setItens([]); setClienteId(''); setBuscaCliente(''); setProdutoId(''); setQtd('1'); setDesconto(''); setPagamento('Pix'); setErr('');
  };

  if (!db.clients.length || !db.products.length) {
    return html`<div><${PageHead} title="Nova venda" />

          <${ErrorNote} msg=${err} />
          <button class=${BTN_GHOST + ' w-full'} onClick=${addItem}><${Icon} name="plus" size=${16} />Adicionar à venda</button>
        </div>
      <//>
      <${Card} title="Itens da venda" className="lg:col-span-3 self-start">
        ${itens.length ? html`<div class="overflow-x-auto"><table class="w-full text-sm">
          <thead class="border-b border-line text-left text-xs text-muted"><tr><th class=${TH}>Produto</th><th class=${TH + ' text-right'}>Qtd.</th><th class=${TH + ' text-right'}>Unitário</th><th class=${TH + ' text-right'}>Total</th><th class=${TH}></th></tr></thead>
          <tbody class="divide-y divide-line">${itens.map(i => html`<tr key=${i.produtoId}><td class=${TD}>${i.nome}</td><td class=${TD + ' tnum text-right'}>${i.qtd}</td><td class=${TD + ' tnum text-right'}>${money(i.precoCent)}</td><td class=${TD + ' tnum text-right font-semibold'}>${money(i.qtd*i.precoCent)}</td><td class=${TD + ' text-right'}><button class=${ICON_BTN} onClick=${() => setItens(l => l.filter(x => x.produtoId !== i.produtoId))}><${Icon} name="x" size=${16}/></button></td></tr>`)}</tbody></table></div>` : html`<${Empty} icon="cart" title="Nenhum item adicionado">Escolha um produto e a quantidade ao lado.<//>`}
        <div class="space-y-4 border-t border-line p-4">
          <div class="grid gap-3 sm:grid-cols-3">
            <${Field} label="Forma de pagamento"><select class=${INPUT} value=${pagamento} onChange=${e => setPagamento(e.target.value)}>${['Pix','Dinheiro','Cartão','Transferência','Boleto'].map(p => html`<option key=${p} value=${p}>${p}</option>`)}</select><//>
            <${Field} label="Desconto (R$)"><input class=${INPUT} inputMode="decimal" value=${desconto} onChange=${e => setDesconto(e.target.value)} placeholder="0,00" /><//>
            ${pagamento === 'Boleto' ? html`<${Field} label="Prazo do boleto (dias)"><input class=${INPUT} inputMode="numeric" value=${prazoDias} onChange=${e => setPrazoDias(e.target.value)} placeholder="30" /><//>` : null}
          </div>
          <div class="rounded-lg bg-canvas p-3 text-right"><p class="text-sm text-muted">Subtotal: ${money(subtotalCent)} ${descontoCent ? html` · Desconto: -${money(descontoCent)}` : null}</p><p class="text-sm text-muted">Total da venda</p><p class="tnum font-display text-3xl font-bold text-ink">${money(totalCent)}</p></div>
          <${ErrorNote} msg=${errCart} />
          <button class=${BTN_PRIMARY + ' w-full py-2.5 text-base'} onClick=${finalize}><${Icon} name="check" size=${18} />Finalizar venda e emitir comprovante</button>

      <//>
    </div>
  </div>`;
}

function Products({ db, setDb, notify, askConfirm }) {
  const empty = { nome: '', custo: '', preco: '', estoque: '', minimo: '20', unidade: 'saco' };
  const [form, setForm] = useState(empty);
  const [editId, setEditId] = useState(null);
  const [err, setErr] = useState('');
  const [showEntry, setShowEntry] = useState(false);
  const [entry, setEntry] = useState({ produtoId: '', qtd: '', observacao: '' });
  const [showMoves, setShowMoves] = useState(false);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  const reset = () => { setForm(empty); setEditId(null); setErr(''); };

  const submit = () => {
    const nome = form.nome.trim();
    const custoCent = toCents(parseNum(form.custo));
    const precoCent = toCents(parseNum(form.preco));
    const estoque = parseNum(form.estoque);
    const minimo = form.minimo.trim() === '' ? 0 : parseNum(form.minimo);
    if (!nome) return setErr('Informe o nome do produto.');
    if (custoCent < 0 || precoCent < 0) return setErr('Informe custo e preço de venda válidos.');
    if (!Number.isInteger(estoque) || estoque < 0) return setErr('O estoque deve ser um número inteiro, zero ou maior.');
    if (!Number.isInteger(minimo) || minimo < 0) return setErr('O estoque mínimo deve ser um número inteiro, zero ou maior.');
    const data = { nome, custoCent, precoCent, estoque, minimo, unidade: form.unidade || 'un.' };
    if (editId) {
      setDb(d => ({ ...d, products: d.products.map(p => p.id === editId ? { ...p, ...data } : p) }));
      notify('Produto atualizado.');
    } else {
      const id = uid();
      setDb(d => ({
        ...d, products: [...d.products, { id, ...data }],
        movements: [{ id: uid(), produtoId: id, tipo: 'Entrada', qtd: estoque, saldoAnterior: 0, saldoNovo: estoque, motivo: 'Estoque inicial', data: new Date().toISOString() }, ...(d.movements || [])]
      }));
      notify('Produto cadastrado.');
    }
    reset();
  };

  const startEdit = p => {
    setEditId(p.id); setErr('');
    setForm({ nome: p.nome, custo: String(fromCents(p.custoCent || 0)).replace('.', ','), preco: String(fromCents(p.precoCent || 0)).replace('.', ','), estoque: String(p.estoque), minimo: String(p.minimo), unidade: p.unidade || 'saco' });
  };

  const openEntry = p => { setEntry({ produtoId: p ? p.id : '', qtd: '', observacao: '' }); setShowEntry(true); };
  const registerEntry = () => {
    const p = db.products.find(x => x.id === entry.produtoId);
    const qtd = parseNum(entry.qtd);
    if (!p) return notify('Selecione o produto.', 'bad');
    if (!Number.isInteger(qtd) || qtd <= 0) return notify('Informe uma quantidade inteira maior que zero.', 'bad');
    const now = new Date().toISOString();
    setDb(d => {
      const cur = d.products.find(x => x.id === p.id);
      const novo = cur.estoque + qtd;
      return {
        ...d,
        products: d.products.map(x => x.id === p.id ? { ...x, estoque: novo } : x),
        movements: [{ id: uid(), produtoId: p.id, tipo: 'Entrada', qtd, saldoAnterior: cur.estoque, saldoNovo: novo, motivo: entry.observacao.trim() || 'Entrada de estoque', data: now }, ...(d.movements || [])]
      };
    });
    setShowEntry(false); setEntry({ produtoId: '', qtd: '', observacao: '' }); notify('Entrada de estoque registrada.');
  };

  const adjustStock = p => {
    const raw = prompt('Informe a quantidade atual correta de "' + p.nome + '".');
    if (raw === null) return;
    const novo = parseNum(raw);
    if (!Number.isInteger(novo) || novo < 0) return notify('Quantidade inválida.', 'bad');
    const diff = novo - p.estoque;
    if (diff === 0) return notify('Nenhuma alteração no estoque.');
    const motivo = prompt('Motivo do ajuste (opcional):') || 'Ajuste de estoque';
    const tipo = diff > 0 ? 'Entrada de ajuste' : 'Baixa de ajuste';
    setDb(d => ({
      ...d,
      products: d.products.map(x => x.id === p.id ? { ...x, estoque: novo } : x),
      movements: [{ id: uid(), produtoId: p.id, tipo, qtd: Math.abs(diff), saldoAnterior: p.estoque, saldoNovo: novo, motivo, data: new Date().toISOString() }, ...(d.movements || [])]
    }));
    notify('Ajuste de estoque registrado.');
  };

  const remove = p => askConfirm({
    title: 'Excluir produto', message: 'Excluir "' + p.nome + '"? As vendas e movimentações anteriores continuam no histórico.', confirmLabel: 'Excluir',
    onConfirm: () => { setDb(d => ({ ...d, products: d.products.filter(x => x.id !== p.id) })); if (editId === p.id) reset(); notify('Produto excluído.'); }
  });

  const valorEstoque = db.products.reduce((a, p) => a + (p.custoCent || 0) * p.estoque, 0);

  return html`<div>
    <${PageHead} title="Produtos e Estoque" sub="Custo, venda, margem e saldo. Use Entrada de estoque quando comprar ou receber mercadoria.">
      <div class="flex flex-wrap gap-2">
        <button class=${BTN_PRIMARY} onClick=${() => openEntry()}><${Icon} name="plus" size=${16} />Entrada de estoque</button>
        <button class=${BTN_GHOST} onClick=${() => setShowMoves(true)}>Histórico de movimentações</button>
        <div class="rounded-lg border border-line bg-surface px-3 py-2 text-sm"><span class="text-muted">Valor de custo em estoque </span><span class="tnum font-semibold text-ink">${money(valorEstoque)}</span></div>
      </div>
    <//>
    <div class="grid gap-4 lg:grid-cols-3">
      <${Card} title=${editId ? 'Editar produto' : 'Novo produto'} className="self-start">
        <div class="space-y-4 p-4" onKeyDown=${enterSubmit(submit)}>
          <${Field} label="Nome do produto"><input class=${INPUT} value=${form.nome} onChange=${e => set('nome', e.target.value)} placeholder="Ex.: Carvão 3kg" /><//>
          <div class="grid grid-cols-2 gap-2">
            <${Field} label="Preço de custo (R$)"><input class=${INPUT} inputMode="decimal" value=${form.custo} onChange=${e => set('custo', e.target.value)} placeholder="7,50" /><//>
            <${Field} label="Preço de venda (R$)"><input class=${INPUT} inputMode="decimal" value=${form.preco} onChange=${e => set('preco', e.target.value)} placeholder="12,00" /><//>
          </div>
          <div class="rounded-lg bg-canvas p-3 text-sm">
            <div class="flex justify-between"><span class="text-muted">Lucro unitário</span><strong>${money((toCents(parseNum(form.preco)) - toCents(parseNum(form.custo))))}</strong></div>
            <div class="mt-1 flex justify-between"><span class="text-muted">Margem</span><strong>${toCents(parseNum(form.preco)) > 0 ? ((toCents(parseNum(form.preco))-toCents(parseNum(form.custo))) / toCents(parseNum(form.preco)) * 100).toFixed(2).replace('.', ',') + '%' : '0,00%'}</strong></div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <${Field} label=${editId ? 'Saldo atual' : 'Quantidade inicial'}><input class=${INPUT} inputMode="numeric" value=${form.estoque} onChange=${e => set('estoque', e.target.value)} placeholder="0" /><//>
            <${Field} label="Unidade"><select class=${INPUT} value=${form.unidade} onChange=${e => set('unidade', e.target.value)}><option value="saco">saco</option><option value="unidade">unidade</option><option value="kg">kg</option><option value="caixa">caixa</option><option value="pacote">pacote</option></select><//>
          </div>
          <${Field} label="Estoque mínimo"><input class=${INPUT} inputMode="numeric" value=${form.minimo} onChange=${e => set('minimo', e.target.value)} placeholder="20" /><//>
          <${ErrorNote} msg=${err} />
          <div class="flex gap-2">
            <button class=${BTN_PRIMARY + ' flex-1'} onClick=${submit}>${editId ? 'Salvar alterações' : 'Cadastrar produto'}</button>
            ${editId ? html`<button class=${BTN_GHOST} onClick=${reset}>Cancelar</button>` : null}
          </div>
        </div>
      <//>
      <${Card} title=${'Produtos cadastrados (' + db.products.length + ')'} className="lg:col-span-2">
        ${db.products.length ? html`<div class="overflow-x-auto"><table class="w-full text-sm">
          <thead class="border-b border-line text-left text-xs text-muted"><tr><th class=${TH}>Produto</th><th class=${TH + ' text-right'}>Custo</th><th class=${TH + ' text-right'}>Venda</th><th class=${TH + ' text-right'}>Lucro</th><th class=${TH + ' text-right'}>Margem</th><th class=${TH + ' text-right'}>Saldo</th><th class=${TH}>Situação</th><th class=${TH}></th></tr></thead>
          <tbody class="divide-y divide-line">${db.products.map(p => {
            const lucro = (p.precoCent || 0) - (p.custoCent || 0);
            const margem = p.precoCent ? lucro / p.precoCent * 100 : 0;
            return html`<tr key=${p.id} class=${editId === p.id ? 'bg-ember-soft' : 'hover:bg-canvas'}>
              <td class=${TD + ' font-medium text-ink'}>${p.nome}<span class="block text-xs text-muted">${p.unidade || 'un.'}</span></td>
              <td class=${TD + ' tnum text-right'}>${money(p.custoCent)}</td>
              <td class=${TD + ' tnum text-right'}>${money(p.precoCent)}</td>
              <td class=${TD + ' tnum text-right font-semibold'}>${money(lucro)}</td>
              <td class=${TD + ' tnum text-right'}>${margem.toFixed(2).replace('.', ',')}%</td>
              <td class=${TD + ' tnum text-right font-semibold'}>${p.estoque} ${p.unidade || 'un.'}</td>
              <td class=${TD}>${p.estoque === 0 ? html`<${Badge} tone="bad">Sem estoque<//>` : p.estoque <= p.minimo ? html`<${Badge} tone="warn">Estoque baixo<//>` : html`<${Badge} tone="ok">Em estoque<//>`}</td>
              <td class=${TD + ' whitespace-nowrap text-right'}>
                <button class=${ICON_BTN} title="Entrada" onClick=${() => openEntry(p)}><${Icon} name="plus" size=${16} /></button>
                <button class=${ICON_BTN} title="Ajustar estoque" onClick=${() => adjustStock(p)}><${Icon} name="pencil" size=${16} /></button>
                <button class=${ICON_BTN} title="Editar" onClick=${() => startEdit(p)}><${Icon} name="pencil" size=${16} /></button>
                <button class=${ICON_BTN} title="Excluir" onClick=${() => remove(p)}><${Icon} name="trash" size=${16} /></button>
              </td>
            </tr>`;
          })}</tbody></table></div>` : html`<${Empty} icon="package" title="Nenhum produto cadastrado">Use o formulário para cadastrar o primeiro produto.<//>`}
      <//>
    </div>

    ${showEntry ? html`<${Modal} title="Entrada de estoque" onClose=${() => setShowEntry(false)}>
      <div class="mt-4 space-y-4">
        <${Field} label="Produto"><select class=${INPUT} value=${entry.produtoId} onChange=${e => setEntry(x => ({...x, produtoId:e.target.value}))}><option value="">Selecione</option>${db.products.map(p => html`<option key=${p.id} value=${p.id}>${p.nome} — saldo ${p.estoque} ${p.unidade || 'un.'}</option>`)}</select><//>
        <${Field} label="Quantidade de entrada"><input class=${INPUT} inputMode="numeric" value=${entry.qtd} onChange=${e => setEntry(x => ({...x, qtd:e.target.value}))} placeholder="Ex.: 500" /><//>
        <${Field} label="Observação"><input class=${INPUT} value=${entry.observacao} onChange=${e => setEntry(x => ({...x, observacao:e.target.value}))} placeholder="Ex.: Compra de carvão a granel" /><//>
        <button class=${BTN_PRIMARY + ' w-full'} onClick=${registerEntry}>Registrar entrada</button>
      </div>
    <//>` : null}

    ${showMoves ? html`<${Modal} title="Histórico de Movimentações" onClose=${() => setShowMoves(false)}>
      <div class="mt-4 max-h-[65vh] overflow-auto">
        ${(db.movements || []).length ? html`<div class="space-y-2">${(db.movements || []).slice(0,100).map(m => {
          const p = db.products.find(x => x.id === m.produtoId);
          return html`<div class="rounded-lg border border-line p-3 text-sm"><div class="flex justify-between gap-2"><strong>${p ? p.nome : 'Produto excluído'}</strong><span class="text-xs text-muted">${fmtDateTime(m.data)}</span></div><div class="mt-1 flex flex-wrap gap-2"><${Badge} tone=${m.tipo.includes('Baixa') || m.tipo === 'Venda' ? 'bad' : 'ok'}>${m.tipo}<//><span>${m.qtd} ${p?.unidade || 'un.'}</span><span class="text-muted">${m.saldoAnterior} → ${m.saldoNovo}</span></div><p class="mt-1 text-xs text-muted">${m.motivo || ''}</p></div>`;
        })}</div>` : html`<p class="text-sm text-muted">Nenhuma movimentação registrada.</p>`}
      </div>
    <//>` : null}
  </div>`;
}

function Clients({ db, setDb, notify, askConfirm }) {
  const empty = { nome: '', doc: '', ie: '', email: '', tel: '', endereco: '', cep: '', cidade: '' };
  const [form, setForm] = useState(empty);
  const [editId, setEditId] = useState(null);
  const [err, setErr] = useState('');
  const [q, setQ] = useState('');

  const reset = () => { setForm(empty); setEditId(null); setErr(''); };

  const submit = () => {
    const nome = form.nome.trim();
    const dd = onlyDigits(form.doc);
    if (!nome) return setErr('Informe o nome ou a razão social.');
    if (dd && dd.length !== 11 && dd.length !== 14) return setErr('O CPF tem 11 dígitos e o CNPJ tem 14.');
    const data = {
      nome,
      doc: form.doc,
      ie: form.ie.trim(),
      email: form.email.trim(),
      tel: form.tel,
      endereco: form.endereco.trim(),
      cep: form.cep,
      cidade: form.cidade.trim()
    };
    if (editId) {
      setDb(d => ({ ...d, clients: d.clients.map(c => c.id === editId ? { ...c, ...data } : c) }));
      notify('Cliente atualizado.');
    } else {
      setDb(d => ({ ...d, clients: [...d.clients, { id: uid(), ...data }] }));
      notify('Cliente cadastrado.');
    }
    reset();
  };
  const startEdit = c => {
    setEditId(c.id); setErr('');
    setForm({
      nome: c.nome || '',
      doc: c.doc || '',
      ie: c.ie || '',
      email: c.email || '',
      tel: c.tel || '',
      endereco: c.endereco || '',
      cep: c.cep || '',
      cidade: c.cidade || ''
    });
  };
  const remove = c => askConfirm({
    title: 'Excluir cliente', message: 'Excluir "' + c.nome + '"? Os comprovantes de vendas anteriores continuam com os dados dele.', confirmLabel: 'Excluir',
    onConfirm: () => { setDb(d => ({ ...d, clients: d.clients.filter(x => x.id !== c.id) })); if (editId === c.id) reset(); notify('Cliente excluído.'); }
  });
  const list = db.clients.filter(c => (c.nome + ' ' + c.doc + ' ' + c.tel + ' ' + (c.email || '') + ' ' + (c.cidade || '')).toLowerCase().includes(q.trim().toLowerCase()));

  return html`<div>
    <${PageHead} title="Clientes" sub="Cadastre quem compra de você. Os dados aparecem no comprovante de venda." />
    <div class="grid gap-4 lg:grid-cols-3">
      <${Card} title=${editId ? 'Editar cliente' : 'Novo cliente'} className="self-start">
        <div class="space-y-4 p-4" onKeyDown=${enterSubmit(submit)}>
          <${Field} label="Nome ou razão social"><input class=${INPUT} value=${form.nome} onChange=${e => set('nome', e.target.value)} placeholder="Ex.: Restaurante Sabor da Serra" /><//>
          <div class="grid grid-cols-2 gap-2">
            <${Field} label="CPF ou CNPJ"><input class=${INPUT} inputMode="numeric" value=${form.doc} onChange=${e => set('doc', maskDoc(e.target.value))} placeholder="000.000.000-00" /><//>
            <${Field} label="Inscrição Estadual (IE)"><input class=${INPUT} value=${form.ie} onChange=${e => set('ie', e.target.value)} placeholder="Opcional" /><//>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <${Field} label="E-mail"><input class=${INPUT} type="email" value=${form.email} onChange=${e => set('email', e.target.value)} placeholder="exemplo@email.com" /><//>
            <${Field} label="Telefone"><input class=${INPUT} inputMode="tel" value=${form.tel} onChange=${e => set('tel', maskPhone(e.target.value))} placeholder="(00) 00000-0000" /><//>
          </div>
          <${Field} label="Endereço (Rua, nº)"><input class=${INPUT} value=${form.endereco} onChange=${e => set('endereco', e.target.value)} placeholder="Ex.: Av. Principal, 100" /><//>
          <div class="grid grid-cols-2 gap-2">
            <${Field} label="CEP"><input class=${INPUT} inputMode="numeric" value=${form.cep} onChange=${e => set('cep', maskCep(e.target.value))} placeholder="00000-000" /><//>
            <${Field} label="Cidade"><input class=${INPUT} value=${form.cidade} onChange=${e => set('cidade', e.target.value)} placeholder="Ex.: São Lourenço - MG" /><//>
          </div>
          <${ErrorNote} msg=${err} />
          <div class="flex gap-2">
            <button class=${BTN_PRIMARY + ' flex-1'} onClick=${submit}>${editId ? 'Salvar alterações' : 'Cadastrar cliente'}</button>
            ${editId ? html`<button class=${BTN_GHOST} onClick=${reset}>Cancelar</button>` : null}
          </div>
        </div>
      <//>
      <${Card} title=${'Clientes cadastrados (' + db.clients.length + ')'} className="lg:col-span-2"
        action=${html`<label class="relative block"><span class="sr-only">Buscar cliente</span><span class="pointer-events-none absolute left-2.5 top-1/2 -translate-y-1/2 text-muted"><${Icon} name="search" size=${15} /></span><input class=${INPUT + ' !w-48 !py-1.5 pl-8'} value=${q} onChange=${e => setQ(e.target.value)} placeholder="Buscar" /></label>`}>
        ${list.length ? html`<div class="overflow-x-auto"><table class="w-full text-sm">
          <thead class="border-b border-line text-left text-xs text-muted"><tr><th class=${TH}>Cliente</th><th class=${TH}>CPF/CNPJ / IE</th><th class=${TH}>Contato</th><th class=${TH}>Endereço / Cidade</th><th class=${TH}><span class="sr-only">Ações</span></th></tr></thead>
          <tbody class="divide-y divide-line">${list.map(c => html`<tr key=${c.id} class=${editId === c.id ? 'bg-ember-soft' : 'hover:bg-canvas'}>
            <td class=${TD + ' font-medium text-ink'}>
              ${c.nome}
              ${c.email ? html`<span class="block text-xs text-muted">${c.email}</span>` : null}
            </td>
            <td class=${TD + ' tnum whitespace-nowrap text-muted'}>
              ${c.doc || '-'}
              ${c.ie ? html`<span class="block text-xs">IE: ${c.ie}</span>` : null}
            </td>
            <td class=${TD + ' tnum whitespace-nowrap text-muted'}>${c.tel || '-'}</td>
            <td class=${TD + ' text-muted'}>
              ${c.endereco || '-'}
              ${(c.cep || c.cidade) ? html`<span class="block text-xs">${[c.cep && 'CEP ' + c.cep, c.cidade].filter(Boolean).join(' - ')}</span>` : null}
            </td>
            <td class=${TD + ' whitespace-nowrap text-right'}>
              <button class=${ICON_BTN} title="Editar" aria-label=${'Editar ' + c.nome} onClick=${() => startEdit(c)}><${Icon} name="pencil" size=${16} /></button>
              <button class=${ICON_BTN} title="Excluir" aria-label=${'Excluir ' + c.nome} onClick=${() => remove(c)}><${Icon} name="trash" size=${16} /></button>
            </td>
          </tr>`)}</tbody></table></div>` : html`<${Empty} icon="users" title=${db.clients.length ? 'Nenhum cliente encontrado' : 'Nenhum cliente cadastrado'}>${db.clients.length ? 'Tente outro nome, documento ou telefone.' : 'Use o formulário para cadastrar o primeiro cliente.'}<//>`}
      <//>
    </div>
  </div>`;
}

function ContasReceber({ db, setDb, notify }) {
  const hoje = new Date();
  const list=(db.receivables||[]).slice().sort((a,b)=>new Date(a.vencimento)-new Date(b.vencimento));
  const status=r=>r.pago?'Pago':(new Date(r.vencimento)<hoje?'Vencido':'Em aberto');
  const marcarPago=r=>{setDb(d=>({...d,receivables:(d.receivables||[]).map(x=>x.id===r.id?{...x,pago:true,pagoEm:new Date().toISOString()}:x)}));notify('Recebimento marcado como pago.');};
  const aberto=list.filter(r=>!r.pago).reduce((a,r)=>a+r.valorCent,0);
  const vencido=list.filter(r=>!r.pago&&new Date(r.vencimento)<hoje).reduce((a,r)=>a+r.valorCent,0);
  return html`<div><${PageHead} title="Contas a Receber" sub="Boletos e vendas a prazo aparecem aqui automaticamente."><div class="rounded-lg border border-line bg-surface px-3 py-2 text-sm">Em aberto: <strong>${money(aberto)}</strong></div></${PageHead}>
    <div class="grid gap-4 sm:grid-cols-2"><div class="rounded-xl border border-line bg-surface p-5"><p class="text-sm text-muted">Total em aberto</p><p class="mt-2 text-3xl font-bold text-warn">${money(aberto)}</p></div><div class="rounded-xl border border-line bg-surface p-5"><p class="text-sm text-muted">Vencido</p><p class="mt-2 text-3xl font-bold text-bad">${money(vencido)}</p></div></div>
    <${Card} title="Títulos" className="mt-4">${list.length?html`<div class="overflow-x-auto"><table class="w-full text-sm"><thead class="border-b border-line text-left text-xs text-muted"><tr><th class=${TH}>Venda</th><th class=${TH}>Cliente</th><th class=${TH}>Vencimento</th><th class=${TH+' text-right'}>Valor</th><th class=${TH}>Status</th><th class=${TH}></th></tr></thead><tbody class="divide-y divide-line">${list.map(r=>html`<tr><td class=${TD}>${pad(r.numero)}</td><td class=${TD}>${r.clienteNome}</td><td class=${TD}>${fmtDate(r.vencimento)}</td><td class=${TD+' text-right font-semibold'}>${money(r.valorCent)}</td><td class=${TD}><${Badge} tone=${r.pago?'ok':status(r)==='Vencido'?'bad':'warn'}>${status(r)}<//></td><td class=${TD+' text-right'}>${!r.pago?html`<button class=${BTN_GHOST} onClick=${()=>marcarPago(r)}>Marcar pago</button>`:null}</td></tr>`)}</tbody></table></div>`:html`<${Empty} icon="receipt" title="Nenhum título em contas a receber">Ao registrar uma venda com boleto, ela aparecerá aqui automaticamente.<//>`}</${Card}>
  </div>`;
}

function Company({ db, setDb, notify, askConfirm }) {
  const [form, setForm] = useState(db.company);
  const autoBackupInfo = getAutoBackupInfo();
  const fileInputRef = useRef(null);

  const set = (k, v) => setForm(f => ({ ...f, [k]: v }));
  
  const save = () => {
    if (!form.razao.trim()) return notify('Informe a razão social.', 'bad');
    setDb(d => ({ ...d, company: { ...form, razao: form.razao.trim() } }));
    notify('Dados da empresa salvos.');
  };

  const handleLogoUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      set('logoUrl', event.target.result);
      notify('Imagem da logo carregada.');
    };
    reader.readAsDataURL(file);
    e.target.value = '';
  };

  const exportBackup = () => {
    const dataStr = "data:application/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db, null, 2));
    const dlAnchorElem = document.createElement('a');
    dlAnchorElem.setAttribute("href", dataStr);
    dlAnchorElem.setAttribute("download", `backup_carvao_${new Date().toISOString().slice(0,10)}.json`);
    dlAnchorElem.click();
    setDb(d => ({ ...d, lastBackupAt: new Date().toISOString() })); notify('Backup baixado com sucesso!');
  };

  const importBackup = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        const importedData = JSON.parse(event.target.result);
        if (importedData && importedData.products && importedData.sales) {
          setDb(importedData);
          setForm(importedData.company || form);
          notify('Dados restaurados com sucesso!');
        } else {
          notify('Arquivo de backup inválido.', 'bad');
        }
      } catch (err) {
        notify('Erro ao ler arquivo de backup.', 'bad');
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  };

  return html`<div>
    <${PageHead} title="Minha empresa" sub="Estes dados saem no topo de todo comprovante. Personalize com a logo do seu negócio." />
    <div class="grid gap-4 lg:grid-cols-3">
      <${Card} title="Dados do comprovante" className="lg:col-span-2 self-start">
        <div class="grid gap-4 p-4 sm:grid-cols-2" onKeyDown=${enterSubmit(save)}>
          <div class="sm:col-span-2"><${Field} label="Razão social"><input class=${INPUT} value=${form.razao} onChange=${e => set('razao', e.target.value)} /><//></div>
          <${Field} label="CNPJ"><input class=${INPUT} inputMode="numeric" value=${form.cnpj} onChange=${e => set('cnpj', maskDoc(e.target.value))} /><//>
          <${Field} label="Telefone"><input class=${INPUT} inputMode="tel" value=${form.telefone} onChange=${e => set('telefone', maskPhone(e.target.value))} /><//>
          <div class="sm:col-span-2"><${Field} label="Endereço"><input class=${INPUT} value=${form.endereco} onChange=${e => set('endereco', e.target.value)} /><//></div>
          
          <div class="sm:col-span-2">
            <${Field} label="Logo do Comprovante (PNG ou JPG)">
              <div class="mt-1 flex items-center gap-4">
                ${form.logoUrl ? html`<img src=${form.logoUrl} class="h-16 w-16 object-contain rounded border border-line bg-white" alt="Logo preview" />` : null}
                <div class="flex-1 flex items-center gap-2">
                  <label class=${BTN_GHOST + ' cursor-pointer flex-1 justify-center'}>
                    <${Icon} name="upload" size=${16} /> Escolher imagem
                    <input type="file" accept="image/png, image/jpeg" onChange=${handleLogoUpload} class="hidden" />
                  </label>
                  ${form.logoUrl ? html`<button type="button" class=${BTN_DANGER} onClick=${() => set('logoUrl', '')}><${Icon} name="trash" size=${16} /></button>` : null}
                </div>
              </div>
            <//>
          </div>

          <div class="sm:col-span-2"><${Field} label="Mensagem no rodapé"><input class=${INPUT} value=${form.rodape} onChange=${e => set('rodape', e.target.value)} /><//></div>
          <div class="sm:col-span-2"><button class=${BTN_PRIMARY} onClick=${save}>Salvar dados da empresa</button></div>
        </div>
      <//>
      <${Card} title="Backup e Gestão de Dados" className="self-start">
        <div class="space-y-3 p-4 text-sm">
          <p class="text-muted">Exporte uma cópia de segurança para não perder suas vendas ou importe seus dados em outro aparelho.</p>
          
          <button class=${BTN_PRIMARY + ' w-full'} onClick=${exportBackup}>
            <${Icon} name="download" size=${16} /> Exportar Backup (Baixar)
          </button>
          
          <input type="file" ref=${fileInputRef} onChange=${importBackup} accept=".json" class="hidden" />
          
          <button class=${BTN_GHOST + ' w-full'} onClick=${() => fileInputRef.current && fileInputRef.current.click()}>
            <${Icon} name="upload" size=${16} /> Restaurar Backup (Carregar)
          </button>
          
          <hr class="border-line my-2"/>
          
          <button class=${BTN_GHOST + ' w-full'} onClick=${() => askConfirm({ title: 'Restaurar dados de exemplo', message: 'Isso substitui produtos, clientes, vendas e dados da empresa pelos exemplos.', confirmLabel: 'Restaurar', danger: false, onConfirm: () => { const s = seedData(); setDb(s); setForm(s.company); notify('Dados de exemplo restaurados.'); } })}>Restaurar dados de exemplo</button>
          <button class=${BTN_GHOST + ' w-full'} onClick=${() => askConfirm({ title: 'Apagar produtos, clientes e vendas', message: 'Isso remove todos os produtos, clientes, vendas e gastos. Os dados da empresa são mantidos. Não dá para desfazer.', confirmLabel: 'Apagar tudo', onConfirm: () => { setDb(d => ({ products: [], clients: [], sales: [], expenses: [], receivables: [], movements: [], company: d.company, seq: 1, autoBackup: d.autoBackup, lastBackupAt: d.lastBackupAt })); notify('Sistema limpo. Cadastre seus produtos e clientes.'); } })}>Começar do zero</button>
        </div>
      <//>
    </div>
  </div>`;
}

const NAV = [
  { key: 'painel', label: 'Painel', icon: 'dashboard' },
  { key: 'fechamento', label: 'Fechamento Mensal', icon: 'calculator' },
  { key: 'receber', label: 'Contas a Receber', icon: 'receipt' },
  { key: 'venda', label: 'Nova venda', icon: 'cart' },
  { key: 'produtos', label: 'Produtos', icon: 'package' },
  { key: 'clientes', label: 'Clientes', icon: 'users' },
  { key: 'empresa', label: 'Minha empresa', icon: 'building' }
];

function App() {
  const [db, setDb] = useState(loadDb);
  const [tab, setTab] = useState('painel');
  const [receiptId, setReceiptId] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [toast, setToast] = useState(null);

  useEffect(() => { saveDb(db); }, [db]);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3200); return () => clearTimeout(t); }, [toast]);
  useEffect(() => { window.scrollTo(0, 0); }, [tab]);

  const notify = (msg, tone = 'ok') => setToast({ msg, tone, id: uid() });
  const askConfirm = cfg => setConfirm(cfg);

  const finalizeSale = ({ clienteId, itens, pagamento, descontoCent, prazoDias }) => {
    const c=db.clients.find(x=>x.id===clienteId); if(!c)return;
    const subtotalCent=itens.reduce((a,i)=>a+i.qtd*i.precoCent,0), totalCent=Math.max(0,subtotalCent-(descontoCent||0));
    const sale={id:uid(),numero:db.seq,data:new Date().toISOString(),cliente:{id:c.id,nome:c.nome,doc:c.doc,ie:c.ie,email:c.email,tel:c.tel,endereco:c.endereco,cep:c.cep,cidade:c.cidade},itens,subtotalCent,descontoCent:descontoCent||0,totalCent,pagamento};
    const movements=itens.map(i=>{const p=db.products.find(x=>x.id===i.produtoId);return {id:uid(),produtoId:i.produtoId,tipo:'Venda',qtd:i.qtd,saldoAnterior:p.estoque,saldoNovo:p.estoque-i.qtd,motivo:'Venda nº '+pad(sale.numero),data:sale.data};});
    let receivable=null;
    if(pagamento==='Boleto'){const due=new Date();due.setDate(due.getDate()+Number(prazoDias||30));receivable={id:uid(),saleId:sale.id,numero:sale.numero,clienteNome:c.nome,valorCent:totalCent,vencimento:due.toISOString(),pago:false};}
    setDb(prev=>({ ...prev,seq:prev.seq+1,sales:[sale,...prev.sales],receivables:receivable?[receivable,...(prev.receivables||[])]: (prev.receivables||[]),movements:[...movements,...(prev.movements||[])],products:prev.products.map(p=>{const it=itens.find(i=>i.produtoId===p.id);return it?{...p,estoque:p.estoque-it.qtd}:p;})}));
    setReceiptId(sale.id); notify('Venda '+pad(sale.numero)+' registrada e estoque atualizado.');
  };
  const cancelSale=sale=>askConfirm({title:'Cancelar venda '+pad(sale.numero),message:'A venda de '+money(sale.totalCent)+' será cancelada. O registro permanecerá no histórico e o estoque será devolvido.',confirmLabel:'Cancelar venda',onConfirm:()=>{
    const now=new Date().toISOString();
    setDb(prev=>({ ...prev,
      sales:prev.sales.map(x=>x.id===sale.id?{...x,status:'Cancelada',canceladaEm:now}:x),
      receivables:(prev.receivables||[]).map(r=>r.saleId===sale.id?{...r,status:'Cancelado'}:r),
      products:prev.products.map(p=>{const it=sale.itens.find(i=>i.produtoId===p.id);return it?{...p,estoque:p.estoque+it.qtd}:p;}),
      movements:[...(sale.itens||[]).map(i=>{const p=prev.products.find(x=>x.id===i.produtoId);return {id:uid(),produtoId:i.produtoId,tipo:'Estorno de venda',qtd:i.qtd,saldoAnterior:p.estoque,saldoNovo:p.estoque+i.qtd,motivo:'Cancelamento venda nº '+pad(sale.numero),data:now};}),...(prev.movements||[])]
    }));
    if(receiptId===sale.id)setReceiptId(null);notify('Venda cancelada e estoque devolvido.');
  }});
  const receiptSale = receiptId ? db.sales.find(s => s.id === receiptId) : null;
  const navBtn = (n, mobile) => html`<button key=${n.key} onClick=${() => setTab(n.key)} aria-current=${tab === n.key ? 'page' : undefined}
    class=${'flex items-center gap-3 whitespace-nowrap rounded-lg px-3 py-2 text-sm font-medium transition focus:outline-none focus-visible:ring-2 focus-visible:ring-ember ' + (mobile ? 'shrink-0 ' : 'w-full ') + (tab === n.key ? 'bg-side-active text-white' : 'text-side-ink hover:bg-side-active hover:text-white')}>
    <span class=${tab === n.key ? 'text-[#FF8F68]' : ''}><${Icon} name=${n.icon} size=${18} /></span>${n.label}
  </button>`;
  const brand = html`<div class="flex items-center gap-3">
    <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-ember text-white"><${Icon} name="flame" size=${20} /></span>
    <div class="min-w-0"><p class="font-display text-base font-bold leading-tight text-white">Estoque e Vendas</p><p class="truncate text-xs text-side-ink">${db.company.razao}</p></div>
  </div>`;

  return html`<${React.Fragment}>
    <div class="app-shell min-h-screen lg:flex">
      <aside class="hidden bg-side p-4 lg:sticky lg:top-0 lg:flex lg:h-screen lg:w-64 lg:shrink-0 lg:flex-col">
        <div class="px-1 py-2">${brand}</div>
        <nav class="mt-6 space-y-1" aria-label="Principal">${NAV.map(n => navBtn(n, false))}</nav>
        <p class="mt-auto px-2 text-xs leading-relaxed text-side-ink">Os dados ficam salvos neste navegador.</p>
      </aside>
      <div class="min-w-0 flex-1">
        <header class="bg-side px-4 pb-3 pt-4 lg:hidden">
          ${brand}
          <nav class="-mx-1 mt-3 flex gap-1 overflow-x-auto px-1 pb-1" aria-label="Principal">${NAV.map(n => navBtn(n, true))}</nav>
        </header>
        <main class="mx-auto max-w-6xl p-4 sm:p-6 lg:p-8">
          ${tab === 'painel' ? html`<${Dashboard} db=${db} gotoTab=${setTab} openReceipt=${setReceiptId} askCancel=${cancelSale} />` : null}
          ${tab === 'fechamento' ? html`<${FechamentoMensal} db=${db} setDb=${setDb} notify=${notify} askConfirm=${askConfirm} />` : null}
           ${tab === 'receber' ? html`<${ContasReceber} db=${db} setDb=${setDb} notify=${notify} />` : null}
          ${tab === 'venda' ? html`<${NewSale} db=${db} onFinalize=${finalizeSale} gotoTab=${setTab} />` : null}
          ${tab === 'produtos' ? html`<${Products} db=${db} setDb=${setDb} notify=${notify} askConfirm=${askConfirm} />` : null}
          ${tab === 'clientes' ? html`<${Clients} db=${db} setDb=${setDb} notify=${notify} askConfirm=${askConfirm} />` : null}
          ${tab === 'empresa' ? html`<${Company} db=${db} setDb=${setDb} notify=${notify} askConfirm=${askConfirm} />` : null}
        </main>
      </div>
    </div>

    ${receiptSale ? html`<${Receipt} sale=${receiptSale} company=${db.company} onClose=${() => setReceiptId(null)} notify=${notify} />` : null}
    ${confirm ? html`<${ConfirmModal} cfg=${confirm} onClose=${() => setConfirm(null)} />` : null}
    ${toast ? html`<div key=${toast.id} role="status" class=${'no-print pop fixed bottom-5 left-1/2 z-[60] flex max-w-[90vw] -translate-x-1/2 items-center gap-2 rounded-lg px-4 py-2.5 text-sm font-medium shadow-lg ' + (toast.tone === 'bad' ? 'bg-bad-soft text-bad' : 'text-white')}
      style=${toast.tone === 'bad' ? { border: '1px solid var(--bad)' } : { background: 'var(--side)', border: '1px solid rgba(255,255,255,.12)' }}>
      <${Icon} name=${toast.tone === 'bad' ? 'alert' : 'check'} size=${16} />${toast.msg}
    </div>` : null}
  <//>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
